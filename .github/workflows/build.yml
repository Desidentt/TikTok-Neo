name: Build TikTok Neo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y apktool zipalign python3 wget

    - name: Download original TikTok APK
      run: |
        # ВСТАВЬ СЮДА СВОЮ ССЫЛКУ ИЗ РАЗДЕЛА RELEASES!
        wget -O original.apk "https://github.com/Desidentt/TikTok-Neo/releases/download/v1.0/original.apk"

    - name: Generate Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -alias neo -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=TikTok Neo, O=Modding, C=US"

    - name: Run Build Script
      env:
        # Увеличиваем лимит памяти до 4 ГБ для apktool
        APKTOOL_JAVA_OPTS: "-Xmx4G -Dfile.encoding=utf-8"
      run: |
        chmod +x scripts/build.sh
        ./scripts/build.sh

    - name: Sign APK
      run: |
        apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --ks-key-alias neo --out TikTok_Neo_Signed.apk TikTok_Neo_Aligned.apk

    - name: Upload APK and Keystore
      uses: actions/upload-artifact@v4
      with:
        name: TikTok-Neo-Files
        path: |
          TikTok_Neo_Signed.apk
          release.keystore
