name: Build TikTok Neo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y zipalign python3 wget unzip

    - name: Download latest Apktool
      run: |
        wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

    - name: Increase Swap Space
      run: |
        sudo swapoff -a
        sudo fallocate -l 10G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Download original TikTok APK
      run: |
        # ВСТАВЬ СЮДА СВОЮ ССЫЛКУ!
        wget -O original.apk "https://github.com/Desidentt/TikTok-Neo/releases/download/v1.0/original.apk"

    - name: Generate Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -alias test -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=TikTok Neo, O=Modding, C=US" -storetype JKS
        
        # Диагностика: проверяем, что ключ создан правильно
        echo "=== Keystore info ==="
        keytool -list -v -keystore release.keystore -storepass 123456 2>&1 | head -30

    - name: Run Build Script
      run: |
        chmod +x scripts/build.sh
        ./scripts/build.sh

    - name: Pre-sign APK for nkstool (v1 enabled)
      run: |
        APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
        $APKSIGNER_PATH sign \
          --ks release.keystore \
          --ks-pass pass:123456 \
          --key-pass pass:123456 \
          --ks-key-alias test \
          --v1-signing-enabled true \
          --v2-signing-enabled false \
          --v3-signing-enabled false \
          --out TikTok_Neo_PreSigned.apk TikTok_Neo_Unsigned.apk

    - name: Bypass Signature Verification (nkstool)
      run: |
        mv TikTok_Neo_PreSigned.apk src.apk
        cp release.keystore test.keystore
        
        wget https://github.com/L-JINBIN/ApkSignatureKiller/raw/master/nkstool.jar
        
        # Создаем конфиг через printf (100% чисто, без пробелов)
        printf 'apk=src.apk\nout=out.apk\nkeystore=test.keystore\nstorepass=123456\nalias=test\nkeypass=123456\n' > config.txt
        
        echo "=== Config content ==="
        cat config.txt
        echo "==================="
        
        # Запускаем nkstool. || true позволяет продолжить, даже если подпись упадет
        # (out.apk создается ДО подписи, поэтому он нам все равно нужен)
        java \
          --add-exports java.base/sun.security.pkcs=ALL-UNNAMED \
          --add-exports java.base/sun.security.x509=ALL-UNNAMED \
          --add-exports java.base/sun.security.util=ALL-UNNAMED \
          --add-opens java.base/java.lang=ALL-UNNAMED \
          --add-opens java.base/java.util=ALL-UNNAMED \
          --add-opens java.base/java.io=ALL-UNNAMED \
          -jar nkstool.jar || echo "nkstool завершил работу с ошибкой, но out.apk мог быть создан"
        
        if [ -f "out.apk" ]; then
          mv out.apk TikTok_Neo_Patched.apk
          echo "Патченный APK готов!"
          ls -la TikTok_Neo_Patched.apk
        else
          echo "Ошибка: out.apk не был создан!"
          ls -la
          exit 1
        fi

    - name: Final Sign APK
      run: |
        # Удаляем старые подписи (если nkstool успел что-то оставить)
        zip -d TikTok_Neo_Patched.apk "META-INF/*" || true
        
        APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
        $APKSIGNER_PATH sign \
          --ks release.keystore \
          --ks-pass pass:123456 \
          --key-pass pass:123456 \
          --ks-key-alias test \
          --v1-signing-enabled true \
          --v2-signing-enabled true \
          --v3-signing-enabled true \
          --min-sdk-version 23 \
          --out TikTok_Neo_Signed.apk TikTok_Neo_Patched.apk

    - name: Upload APK and Keystore
      uses: actions/upload-artifact@v4
      with:
        name: TikTok-Neo-Files
        path: |
          TikTok_Neo_Signed.apk
          release.keystore
