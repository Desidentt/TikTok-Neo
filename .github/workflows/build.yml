name: Build TikTok Neo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y zipalign python3 wget unzip

    - name: Download latest Apktool
      run: |
        wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

    - name: Increase Swap Space
      run: |
        sudo swapoff -a
        sudo fallocate -l 10G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Download original TikTok APK
      run: |
        wget -O original.apk "https://github.com/Desidentt/TikTok-Neo/releases/download/v1.0/original.apk"

    - name: Generate Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -alias neo -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=TikTok Neo, O=Modding, C=US"

    - name: Run Build Script
      run: |
        chmod +x scripts/build.sh
        ./scripts/build.sh

    # --- НОВЫЙ ШАГ: Подписываем APK перед nkstool (с включенной v1 схемой) ---
    - name: Pre-sign APK for nkstool (v1 enabled)
      run: |
        APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
        $APKSIGNER_PATH sign \
          --ks release.keystore \
          --ks-pass pass:123456 \
          --key-pass pass:123456 \
          --ks-key-alias neo \
          --v1-signing-enabled true \
          --v2-signing-enabled false \
          --v3-signing-enabled false \
          --out TikTok_Neo_PreSigned.apk TikTok_Neo_Unsigned.apk

    - name: Bypass Signature Verification (nkstool)
      run: |
        # nkstool ищет src.apk, поэтому переименовываем предварительно подписанный APK
        mv TikTok_Neo_PreSigned.apk src.apk
        
        wget https://github.com/L-JINBIN/ApkSignatureKiller/raw/master/nkstool.jar
        wget https://github.com/L-JINBIN/ApkSignatureKiller/raw/master/config.txt
        
        java -jar nkstool.jar
        
        # Ищем результат работы утилиты
        if [ -f "src_killer.apk" ]; then
          mv src_killer.apk TikTok_Neo_Patched.apk
        elif [ -f "dist.apk" ]; then
          mv dist.apk TikTok_Neo_Patched.apk
        else
          echo "Ошибка: Выходной файл nkstool не найден!"
          ls -la
          exit 1
        fi

    # --- ФИНАЛЬНАЯ ПОДПИСЬ (после внедрения обхода) ---
    - name: Final Sign APK
      run: |
        APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
        $APKSIGNER_PATH sign \
          --ks release.keystore \
          --ks-pass pass:123456 \
          --key-pass pass:123456 \
          --ks-key-alias neo \
          --v1-signing-enabled true \
          --v2-signing-enabled true \
          --v3-signing-enabled true \
          --min-sdk-version 23 \
          --out TikTok_Neo_Signed.apk TikTok_Neo_Patched.apk

    - name: Upload APK and Keystore
      uses: actions/upload-artifact@v4
      with:
        name: TikTok-Neo-Files
        path: |
          TikTok_Neo_Signed.apk
          release.keystore
