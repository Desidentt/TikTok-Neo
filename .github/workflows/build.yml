name: Build TikTok Neo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y zipalign python3 wget unzip

    - name: Download latest Apktool
      run: |
        wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

    - name: Increase Swap Space
      run: |
        sudo swapoff -a
        sudo fallocate -l 10G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Download original TikTok APK
      run: |
        # ВСТАВЬ СЮДА СВОЮ ССЫЛКУ!
        wget -O original.apk "https://github.com/Desidentt/TikTok-Neo/releases/download/v1.0/original.apk"

    - name: Generate Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -alias test -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=TikTok Neo, O=Modding, C=US" -storetype JKS

    - name: Run Build Script
      run: |
        chmod +x scripts/build.sh
        ./scripts/build.sh

    - name: Patch with LSPatch (Bypass Signature)
      run: |
        # Сначала идут все флаги, в конце - имя APK
        java -jar lspatch-v1.2-487-release.jar \
          --bypass-signature-check \
          -o lspatch_output \
          TikTok_Neo_Unsigned.apk
        
        # LSPatch создает папку lspatch_output и кладет туда пропатченный файл
        if [ -d "lspatch_output" ]; then
          mv lspatch_output/*.apk TikTok_Neo_Patched.apk
          echo "LSPatch успешно применил патч обхода подписи!"
        else
          echo "Ошибка: папка lspatch_output не создана!"
          exit 1
        fi

    - name: Final Sign APK
      run: |
        zip -d TikTok_Neo_Patched.apk "META-INF/*" || true
        
        APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
        $APKSIGNER_PATH sign \
          --ks release.keystore \
          --ks-pass pass:123456 \
          --key-pass pass:123456 \
          --ks-key-alias test \
          --v1-signing-enabled true \
          --v2-signing-enabled true \
          --v3-signing-enabled true \
          --min-sdk-version 23 \
          --out TikTok_Neo_Signed.apk TikTok_Neo_Patched.apk

    - name: Upload APK and Keystore
      uses: actions/upload-artifact@v4
      with:
        name: TikTok-Neo-Files
        path: |
          TikTok_Neo_Signed.apk
          release.keystore
